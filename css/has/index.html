<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>验证has伪元素</title>
    <style>
        /* 包含.h-element且包含h2 */
        div:has(.h-element):has(h2){
            background-color: blueviolet;
        }
        /* 包含.h-element或者包含h2*/
        div:has(.h-element,h2){
            background-color: blueviolet;
        }
    </style>
</head>
<body>
    <div>
        <h1 class="h-element">标题1</h1>
        <h2></h2>
    </div>
    <div>
        <h2>标题2</h2>
    </div>
</body>
</html>
