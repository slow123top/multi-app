<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>验证tabindex特性</title>
    <style>
        div{
            width: 100px;
            height: 100px;
            border: 1px solid #000;
        }
        div:focus {
            border: 1px solid red;
        }
    </style>
</head>
<body>
    <div tabindex="2">元素1</div>
    <div tabindex="1">元素2</div>
    <div tabindex="2">元素3</div>
    <div tabindex="0">元素4</div>
    <div tabindex="6">元素5</div>
    <script>
        const divElementList = document.getElementsByTagName('div');
        [...divElementList].forEach(item=>{
            item.addEventListener('click',(e)=>{
            e.target.focus()
        })
        })
    </script>
</body>
</html>
