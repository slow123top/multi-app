<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>slot页面</title>
    <style>
        p{
            color: red;
        }
        ::slotted(p){
            color: aqua;
        }
    </style>
</head>
<body>
    <div>
        <p>外层</p>
    </div>
    <div>
        <slot name="slotName"><p>slot内部</p></slot>
    </div>
</body>
</html>
